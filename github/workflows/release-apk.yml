name: Release APK

# با پوش کردن یک تگ به شکل v1.0.0 اجرا می‌شود و APK را به یک Release در گیت‌هاب پیوست می‌کند.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # اگر می‌خواهید APK امضا شده (قابل نصب مستقیم) بسازید، این سه Secret را
      # در تنظیمات ریپازیتوری (Settings → Secrets and variables → Actions) اضافه کنید:
      #   RELEASE_KEYSTORE_BASE64   (فایل keystore با base64 انکود شده)
      #   RELEASE_KEYSTORE_PASSWORD
      #   RELEASE_KEY_ALIAS
      #   RELEASE_KEY_PASSWORD
      - name: Decode keystore (if provided)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "RELEASE_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivarSmartSearch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
